# Para Ventoy y otras herramientas que arrancan la ISO con loopback.
search --no-floppy --set=archiso_img_dev --file "${iso_path}"
probe --set archiso_img_dev_uuid --fs-uuid "${archiso_img_dev}"

insmod all_video
insmod gfxterm
insmod png
if loadfont "${prefix}/themes/pekarchos/pekarchos.pf2" ; then
    set gfxmode=auto
    terminal_output gfxterm
    set theme=/boot/grub/themes/pekarchos/theme.txt
else
    terminal_output console
fi

if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu}-${grub_platform}"
fi

if [ "${grub_platform}" == 'efi' ]; then
    if [ "${grub_cpu}" == 'x86_64' ]; then
        uefi_machine_type_lower='x64'
    elif [ "${grub_cpu}" == 'i386' ]; then
        uefi_machine_type_lower='ia32'
    elif [ "${grub_cpu}" == 'arm64' ]; then
        uefi_machine_type_lower='aa64'
    fi
fi

default=pekarchos
timeout=15
timeout_style=menu

menuentry "PekarchOS (%ARCH%, ${archiso_platform})" --class gnu-linux --class os --id 'pekarchos' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" quiet splash %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "PekarchOS con lector de pantalla (%ARCH%, ${archiso_platform})" --hotkey s --class gnu-linux --class os --id 'pekarchos-lector' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" accessibility=on quiet splash %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "PekarchOS (gráficos seguros)" --class gnu-linux --class os --id 'pekarchos-seguro' {
    set gfxpayload=text
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" nomodeset plymouth.enable=0 %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "PekarchOS (compatibilidad Ryzen/USB)" --class gnu-linux --class os --id 'pekarchos-ryzen' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" processor.max_cstate=5 usbcore.autosuspend=-1 pcie_aspm=off quiet splash %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

if [ "${grub_platform}" == 'efi' -a -f "/boot/memtest86+/memtest86${uefi_machine_type_lower}.efi" ]; then
    menuentry "Probar la memoria (Memtest86+)" --class memtest --class tool {
        linux /boot/memtest86+/memtest86${uefi_machine_type_lower}.efi
    }
fi

menuentry "Apagar" --class shutdown {
    halt
}

menuentry "Reiniciar" --class reboot {
    reboot
}
