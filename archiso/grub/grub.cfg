# Menú de la ISO en vivo (UEFI con GRUB). Los %TOKEN% los rellena mkarchiso.
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf
insmod all_video
insmod gfxterm
insmod png
insmod serial
insmod usbserial_common
insmod usbserial_ftdi
insmod usbserial_pl2303
insmod usbserial_usbdebug

if loadfont "${prefix}/themes/pekarchos/pekarchos.pf2" ; then
    set gfxmode=auto
    set gfxpayload=keep
    terminal_output gfxterm
    terminal_input console
    set theme=/boot/grub/themes/pekarchos/theme.txt
else
    terminal_output console
    terminal_input console
    echo "PekarchOS: no se cargó la fuente del tema. Menú en texto."
fi

if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu}-${grub_platform}"
fi

if [ "${grub_platform}" == 'efi' ]; then
    if [ "${grub_cpu}" == 'x86_64' ]; then
        uefi_machine_type_lower='x64'
    elif [ "${grub_cpu}" == 'i386' ]; then
        uefi_machine_type_lower='ia32'
    elif [ "${grub_cpu}" == 'arm64' ]; then
        uefi_machine_type_lower='aa64'
    elif [ "${grub_cpu}" == 'riscv64' ]; then
        uefi_machine_type_lower='riscv64'
    elif [ "${grub_cpu}" == 'loongarch64' ]; then
        uefi_machine_type_lower='loongarch64'
    fi
fi

default=pekarchos
timeout=15
timeout_style=menu

menuentry "PekarchOS (%ARCH%, ${archiso_platform})" --class gnu-linux --class os --id 'pekarchos' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "PekarchOS con lector de pantalla (%ARCH%, ${archiso_platform})" --hotkey s --class gnu-linux --class os --id 'pekarchos-lector' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on quiet splash %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "PekarchOS (gráficos seguros)" --class gnu-linux --class os --id 'pekarchos-seguro' {
    set gfxpayload=text
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset plymouth.enable=0 %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "PekarchOS (compatibilidad Ryzen/USB)" --class gnu-linux --class os --id 'pekarchos-ryzen' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% processor.max_cstate=5 usbcore.autosuspend=-1 pcie_aspm=off quiet splash %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

if [ "${grub_platform}" == 'efi' -a -f "/boot/memtest86+/memtest86${uefi_machine_type_lower}.efi" ]; then
    menuentry "Probar la memoria (Memtest86+)" --class memtest --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest86${uefi_machine_type_lower}.efi
    }
elif [ "${grub_platform}" == 'pc' -a -f '/boot/memtest86+/memtest' ]; then
    menuentry "Probar la memoria (Memtest86+)" --class memtest --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest
    }
fi

if [ "${grub_platform}" == 'efi' ]; then
    if [ -f "/shell${uefi_machine_type_lower}.efi" ]; then
        menuentry "Consola UEFI" --class efi {
            chainloader /shell${uefi_machine_type_lower}.efi
        }
    fi
    menuentry "Ajustes del firmware UEFI" --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry "Apagar" --class shutdown --class poweroff {
    halt
}

menuentry "Reiniciar" --class reboot --class restart {
    reboot
}
