LABEL arch
TEXT HELP
Arranca PekarchOS en BIOS, con el escritorio Plasma.
ENDTEXT
MENU LABEL PekarchOS (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash %KERNEL_PARAMS%

LABEL archspeech
TEXT HELP
Arranca PekarchOS en BIOS con el lector de pantalla speakup.
ENDTEXT
MENU LABEL PekarchOS (%ARCH%, BIOS) con lector de ^pantalla
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on quiet splash %KERNEL_PARAMS%

LABEL archseguro
TEXT HELP
Graficos sin aceleracion (nomodeset). Sirve si la pantalla se queda negra,
por ejemplo con nouveau. No carga la animacion de arranque.
ENDTEXT
MENU LABEL PekarchOS (graficos seguros)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset plymouth.enable=0 %KERNEL_PARAMS%

LABEL archryzen
TEXT HELP
Para cuelgues de raton y teclado en Ryzen de primera generacion y USB AMD.
Anade processor.max_cstate=5, usbcore.autosuspend=-1 y pcie_aspm=off.
ENDTEXT
MENU LABEL PekarchOS (compatibilidad Ryzen/USB)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% processor.max_cstate=5 usbcore.autosuspend=-1 pcie_aspm=off quiet splash %KERNEL_PARAMS%
