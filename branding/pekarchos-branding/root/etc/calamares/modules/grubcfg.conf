---
overwrite: false
prefer_grub_d: false
keep_distributor: false
kernel_params:
  - quiet
  - splash
defaults:
  GRUB_TIMEOUT: 5
  GRUB_DISTRIBUTOR: PekarchOS
  GRUB_DISABLE_OS_PROBER: false
  GRUB_THEME: /usr/share/grub/themes/pekarchos/theme.txt
  GRUB_FONT: /usr/share/grub/themes/pekarchos/pekarchos.pf2
  GRUB_GFXMODE: auto
always_use_defaults: false
