---
defaultGroups:
  - users
  - wheel
  - audio
  - video
  - optical
  - storage
  - network
  - lp
  - scanner
  - render
  - input
sudoersGroup: wheel
sudoersConfigureWithGroup: true
setRootPassword: true
doAutologin: false
passwordRequirements:
  minLength: 1
  maxLength: -1
  libpwquality:
    - minlen=1
    - minclass=0
allowWeakPasswords: true
allowWeakPasswordsDefault: true
user:
  shell: /bin/bash
  forbidden_names:
    - root
    - live
  home_permissions: "750"
hostname:
  location: EtcFile
  writeHostsFile: true
  template: pekarchos
  forbidden_names:
    - localhost
allowActiveDirectory: false
