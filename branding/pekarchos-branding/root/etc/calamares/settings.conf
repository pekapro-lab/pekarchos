---
modules-search: [ local ]

instances:
  - id: escritorios
    module: netinstall
  - id: gpu
    module: netinstall
  - id: limpiar
    module: shellprocess
  - id: cuenta
    module: shellprocess
  - id: cierre
    module: shellprocess

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - netinstall@escritorios
      - netinstall@gpu
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - shellprocess@limpiar
      - initcpiocfg
      - initcpio
      - users
      - shellprocess@cuenta
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - packages
      - grubcfg
      - bootloader
      - shellprocess@cierre
      - umount
  - show:
      - finished

branding: pekarchos
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
